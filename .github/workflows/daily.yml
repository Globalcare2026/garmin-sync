name: Daily Garmin Sync

on:
  schedule:
    # 06:15 UTC = 08:15 Amsterdam (Sommer) / 07:15 (Winter)
    - cron: '15 6 * * *'
  workflow_dispatch:  # manueller Start über den Actions-Tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: garmin-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin tokens
        uses: actions/cache@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-v1

      - name: Run Garmin sync
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DAYS_BACK: 14
        run: python sync.py

      - name: Save data to repo
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/latest "data/archive/$DATE"
          cp out/* data/latest/
          cp out/* "data/archive/$DATE/"
          git config user.name "garmin-sync-bot"
          git config user.email "garmin-sync-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Garmin data $DATE"
          git push
